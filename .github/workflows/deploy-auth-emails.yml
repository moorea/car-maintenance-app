name: Deploy auth emails

# Pushes the sign-in email templates to the hosted Supabase project after they merge. Run it by
# hand after setting up custom SMTP, since Supabase ignores custom templates without it.
on:
  push:
    branches: [main]
    paths: ['supabase/templates/**', 'scripts/push-auth-emails.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth-emails
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vdklyvktmbcocwmiqkze
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/push-auth-emails.sh
