name: Deploy database

# Applies new migrations in supabase/migrations to the hosted Supabase project after they merge,
# then deploys powersync/sync-rules.yaml to the hosted PowerSync instance. Both are checked in CI
# (SQL lint and pgTAP; the sync rules tests and the Sync rules workflow) before they can merge.
# Sync rules go out after every migration too, so they are never left behind the schema.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'powersync/**', '.github/workflows/deploy-db.yml']
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a later one waits rather than cancelling one mid-migration.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    # A manual run from another branch must not deploy that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vdklyvktmbcocwmiqkze
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Show pending migrations
        run: supabase migration list
      - run: supabase db push --yes

  # Runs after the migrations, so streams never go live before the tables they read exist. Needs
  # a PowerSync personal access token in the PS_ADMIN_TOKEN secret; skips with a warning until then.
  sync-rules:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      # The instance id is the first label of EXPO_PUBLIC_POWERSYNC_URL; it is not a secret.
      INSTANCE_ID: 6ad3a8c62f27853eb0afd855
    steps:
      - name: Check for the PowerSync token
        id: token
        env:
          PS_ADMIN_TOKEN: ${{ secrets.PS_ADMIN_TOKEN }}
        run: |
          if [ -z "$PS_ADMIN_TOKEN" ]; then
            echo "::warning::PS_ADMIN_TOKEN is not set, so sync rules were not deployed. Add it, then run this workflow by hand."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # A deploy redeploys the instance even when nothing changed, so it only runs on a difference.
      # Both commands validate first and stop on any error; the deploy waits for the instance to
      # report it done, with room for re-provisioning an instance that was stopped.
      - name: Deploy sync rules
        if: steps.token.outputs.present == 'true'
        env:
          PS_ADMIN_TOKEN: ${{ secrets.PS_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          args=(--instance-id "$INSTANCE_ID" --sync-config-file-path powersync/sync-rules.yaml)
          pnpm exec powersync deploy sync-config --dry-run "${args[@]}" | tee "$RUNNER_TEMP/dry-run.txt"
          if grep -q 'matches the deployed sync config' "$RUNNER_TEMP/dry-run.txt"; then
            echo "Sync rules are already deployed."
          else
            pnpm exec powersync deploy sync-config --deploy-timeout 900 "${args[@]}"
          fi
