name: Import NHTSA bulletins

# NHTSA publishes manufacturer communications (service bulletins, warranty extensions) and the
# mileage of each owner complaint only as bulk files, so this job downloads them and stores the
# rows for model years someone owns (packages/importer, ADR 0015). It checks the files' ETags
# first, so a run with nothing new and no new car takes about a minute.
on:
  schedule:
    - cron: '23 */3 * * *'
  # Straight after migrations are applied, so a new or changed import runs against its tables.
  workflow_run:
    workflows: ['Deploy database']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Import even if no file changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-nhtsa
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vdklyvktmbcocwmiqkze
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @car/importer
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Linking records the project's connection pooler, which GitHub's runners can reach (the
      # direct database host is IPv6 only).
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Import
        run: |
          DATABASE_URL="$(cat supabase/.temp/pooler-url)"
          test -n "$DATABASE_URL" || { echo "supabase link wrote no pooler URL"; exit 1; }
          export DATABASE_URL
          node packages/importer/src/main.ts ${{ inputs.force && '--force' || '' }}
