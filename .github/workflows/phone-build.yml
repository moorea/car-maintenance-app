name: Phone build

# Builds an Android APK to install on a real phone, run by hand from the Actions tab. CI's own APK
# only runs on the emulator (x86_64, demo data); this one is for phones (arm64-v8a) and runs against
# the real backend when the EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY and
# EXPO_PUBLIC_POWERSYNC_URL repository variables are set, otherwise on demo data. All three are
# public values (see apps/mobile/.env.example). Signed with the debug key `expo prebuild`
# generates, so it installs by sideloading, not from Google Play.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 1
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_POWERSYNC_URL: ${{ vars.EXPO_PUBLIC_POWERSYNC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android
      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Say which backend it uses
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] && [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$EXPO_PUBLIC_POWERSYNC_URL" ]; then
            echo "Built against $EXPO_PUBLIC_SUPABASE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built on demo data: the EXPO_PUBLIC_* repository variables are not all set." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: car-maintenance-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
