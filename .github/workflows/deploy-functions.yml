name: Deploy functions

# Bundles the assistant (packages/server, which includes packages/core) and deploys it to the
# hosted Supabase project after it merges. Its secrets (ANTHROPIC_API_KEY) live in Supabase.
on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/core/src/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

# Shares the database deploy's group, so the two never run at once, and applies any pending
# migrations itself first: the function must not go live before the tables it uses exist.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets are given only to the steps that call Supabase, never to `pnpm install` or the
    # build, where a compromised dependency's code could read the environment.
    env:
      PROJECT_REF: vdklyvktmbcocwmiqkze
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - run: pnpm --filter @car/server build
      - name: Apply migrations and deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --yes
          supabase functions deploy assistant --project-ref "$PROJECT_REF" --use-api
