name: Deploy functions

# Bundles the assistant (packages/server, which includes packages/core) and deploys it to the
# hosted Supabase project after it merges. Its secrets (ANTHROPIC_API_KEY) live in Supabase.
on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/core/src/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

# Shares the database deploy's group, so the two never run at once, and applies any pending
# migrations itself first: the function must not go live before the tables it uses exist.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets are given only to the steps that call Supabase, never to `pnpm install` or the
    # build, where a compromised dependency's code could read the environment.
    env:
      PROJECT_REF: vdklyvktmbcocwmiqkze
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - run: pnpm --filter @car/server build
      - name: Apply migrations and deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --yes
          supabase functions deploy assistant --project-ref "$PROJECT_REF" --use-api
