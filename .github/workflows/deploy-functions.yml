name: Deploy functions

# Bundles the assistant (packages/server, which includes packages/core) and deploys it to the
# hosted Supabase project after it merges. Its secrets (ANTHROPIC_API_KEY) live in Supabase.
on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/core/src/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

# Shares the database deploy's group, so the two never run at once, and applies any pending
# migrations itself first: the function must not go live before the tables it uses exist.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vdklyvktmbcocwmiqkze
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --yes
      - run: pnpm --filter @car/server build
      - run: supabase functions deploy assistant --project-ref "$PROJECT_REF" --use-api
