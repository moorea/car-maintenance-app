name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Catches what typechecking cannot: Metro failing to resolve workspace packages, or
      # dependencies that do not match the Expo SDK.
      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Bundle the app
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --platform web --output-dir ${{ runner.temp }}/expo-export

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Check scripts and sign-in emails
        run: |
          shellcheck scripts/*.sh
          for f in supabase/templates/magic_link.html supabase/templates/confirmation.html; do
            grep -qF '{{ .Token }}' "$f" || { echo "$f must show the sign-in code"; exit 1; }
          done
      - run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level warning --fail-on warning
      - run: supabase test db

  # Builds the app for the iOS simulator and launches it, since screens are otherwise only run on
  # the web build. Needs no Apple account: simulator builds are not code signed.
  ios:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 75
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # The job can write (for the screenshots branch); keep the token away from install scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xcodebuild -version
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace CarMaintenance.xcworkspace \
            -scheme CarMaintenance \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
      - name: Boot a simulator and install the app
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator/CarMaintenance.app"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        run: maestro test --test-output-dir "$RUNNER_TEMP/maestro" apps/mobile/e2e
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          # takeScreenshot writes to the working directory; failure screenshots go to the output dir.
          find . "$RUNNER_TEMP/maestro" -name '*.png' -newer package.json -not -path '*/node_modules/*' \
            -exec cp {} "$RUNNER_TEMP/screenshots/" \; || true
          xcrun simctl io booted screenshot "$RUNNER_TEMP/screenshots/last.png" || true
      # Also keep the screenshots on the ios-screenshots branch, one folder per commit, so a PR can
      # show them inline and they can be fetched with plain git. Skipped for forks (no write token).
      - name: Publish screenshots to the ios-screenshots branch
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/ios-screenshots"
          remote="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 "$remote" ios-screenshots; then
            git worktree add "$dir" FETCH_HEAD --detach
          else
            git worktree add --detach "$dir" && git -C "$dir" checkout --orphan tmp && git -C "$dir" rm -rfq .
          fi
          mkdir -p "$dir/$SHA" && cp "$RUNNER_TEMP"/screenshots/*.png "$dir/$SHA/"
          git -C "$dir" add "$SHA" && git -C "$dir" commit -qm "iOS simulator screenshots for $SHA"
          for attempt in 1 2 3; do
            git -C "$dir" push "$remote" HEAD:refs/heads/ios-screenshots && exit 0
            git -C "$dir" fetch --depth 1 "$remote" ios-screenshots && git -C "$dir" rebase FETCH_HEAD
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro
