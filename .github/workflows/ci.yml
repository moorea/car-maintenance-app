name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories that cannot be fixed yet are listed, with reasons, in pnpm-workspace.yaml.
      - name: Dependency audit
        run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The landing, privacy and support pages; deploy-site.yml publishes them after merge.
      - name: Build the site
        run: pnpm --filter @car/site build
      # Catches what typechecking cannot: Metro failing to resolve workspace packages, or
      # dependencies that do not match the Expo SDK.
      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Bundle the app
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --platform web --output-dir "$RUNNER_TEMP/expo-export"

  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # The edge function is a bundle of packages/server. Check it builds, loads in Deno and
      # answers, as it will on Supabase.
      - run: pnpm --filter @car/server build
      - run: scripts/smoke-assistant.sh

  # Builds a release APK and drives it on an Android emulator with Maestro. iOS is the main target,
  # but this keeps the app launching and laying out on Android. Needs no Google Play account: the
  # release build is signed with the debug key that `expo prebuild` generates.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 1
      # Pinned so a Maestro release cannot change or break CI unannounced.
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android
      # Only the emulator's architecture, which roughly quarters the native build.
      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator runner runs each script line on its own, so the steps live in one script.
          script: scripts/android-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: android-emulator
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro

  # Keeps the latest emulator screenshots on the android-screenshots branch, one folder per commit,
  # so a PR can show them inline and they can be fetched with plain git. A separate job so the
  # write token never shares a runner with install scripts or app code. Skipped for forks.
  android-screenshots:
    needs: android
    # Dependabot's PRs get a read-only token, so they skip publishing too.
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KEEP: 40
    steps:
      # Missing when the build failed before the emulator ran; the step below then finds nothing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: android-emulator
          path: ${{ runner.temp }}/artifact
      - name: Publish to the android-screenshots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          shots="$RUNNER_TEMP/artifact/screenshots"
          compgen -G "$shots/*.png" > /dev/null || { echo "No screenshots to publish"; exit 0; }
          remote="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git init -q branch && cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each publish replaces the branch with one commit holding the newest $KEEP folders, so
          # clones never carry the screenshot history.
          for attempt in 1 2 3; do
            git rm -rqf --ignore-unmatch . && rm -rf -- * && lease=""
            if git fetch -q --depth 1 "$remote" android-screenshots; then
              git checkout -q --detach FETCH_HEAD
              lease="$(git rev-parse HEAD)"
            fi
            rm -rf "$SHA" && mkdir "$SHA" && cp "$shots"/*.png "$SHA/"
            grep -vx "$SHA" order.txt 2> /dev/null > order.new || true
            echo "$SHA" >> order.new && tail -n "$KEEP" order.new > order.txt && rm order.new
            for dir in */; do grep -qx "${dir%/}" order.txt || rm -rf "$dir"; done
            git checkout -q --orphan "publish-$attempt"
            git add -A && git commit -qm "Android emulator screenshots, latest $SHA"
            git push -q --force-with-lease="android-screenshots:$lease" "$remote" HEAD:refs/heads/android-screenshots && exit 0
          done
          exit 1

  # The repo is public, so an unsafe workflow or a committed key is open to everyone. zizmor audits
  # the workflows (injection, credentials, unpinned or impostor actions); gitleaks scans every
  # commit for secrets. Both are pinned, and gitleaks is checked against its published checksum.
  security:
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: 1.31.1
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit workflows
        env:
          # Lets zizmor check that each pinned commit really belongs to the action it names.
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==$ZIZMOR_VERSION" --format=github .github
      - name: Scan for secrets
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner .

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - name: Check scripts and sign-in emails
        run: |
          shellcheck scripts/*.sh
          for f in supabase/templates/magic_link.html supabase/templates/confirmation.html; do
            grep -qF '{{ .Token }}' "$f" || { echo "$f must show the sign-in code"; exit 1; }
          done
      - run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level warning --fail-on warning
      - run: supabase test db

  # Real sync, end to end: the app's data layer on Node, as two or more phones, against a local
  # Supabase (this repo's migrations, RLS, Storage) and a self-hosted PowerSync serving this repo's
  # sync rules. Covers what mocks cannot: offline queues, other owners, and deletes propagating.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Only what the data layer talks to: Postgres, Auth, PostgREST, Storage and the gateway.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
      - run: scripts/start-local-sync.sh
      - run: pnpm --filter @car/data test:e2e
      - name: PowerSync logs
        if: ${{ failure() }}
        run: docker logs powersync_car-maintenance-app 2>&1 | tail -n 300

  # Builds the app for the iOS simulator and launches it, since screens are otherwise only run on
  # the web build. Needs no Apple account: simulator builds are not code signed.
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 1
      # Pinned so a Maestro release cannot change or break CI unannounced.
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: 1
      # Starting the XCTest driver on a cold simulator can take over the 2 minute default.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xcodebuild -version
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace CarMaintenance.xcworkspace \
            -scheme CarMaintenance \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
      - name: Boot a simulator and install the app
        run: |
          # The UI flows tap round buttons by screen position, so prefer one standard size and
          # only fall back to whichever iPhone the runner image has.
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))]
                | ([.[] | select(.name == "iPhone 17 Pro")] + .)[0].udid')
          [ "$udid" != null ] || { echo "No iPhone simulator available"; xcrun simctl list; exit 1; }
          echo "Booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator/CarMaintenance.app"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: UI flows (smoke test and screen sweep)
        run: maestro test --test-output-dir "$RUNNER_TEMP/maestro" apps/mobile/e2e
      # Screens again at the largest accessibility text size, to see Dynamic Type at its limit.
      - name: Largest text size
        run: |
          xcrun simctl ui booted content_size accessibility-extra-extra-extra-large
          maestro test --test-output-dir "$RUNNER_TEMP/maestro/large-text" apps/mobile/e2e-large-text
      - name: Collect screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          # takeScreenshot writes to the working directory; failure screenshots go to the output dir.
          find . "$RUNNER_TEMP/maestro" -name '*.png' -newer package.json \
            -not -path '*/node_modules/*' -not -path '*/ios/*' -not -name 'App-Icon*' \
            -exec cp {} "$RUNNER_TEMP/screenshots/" \; || true
          xcrun simctl io booted screenshot "$RUNNER_TEMP/screenshots/last.png" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro

  # Keeps the latest screenshots on the ios-screenshots branch, one folder per commit, so a PR can
  # show them inline and they can be fetched with plain git. A separate job so the write token
  # never shares a runner with install scripts or app code. Skipped for forks (no write token).
  ios-screenshots:
    needs: ios
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KEEP: 40
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/artifact
      - name: Publish to the ios-screenshots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          shots="$RUNNER_TEMP/artifact/screenshots"
          compgen -G "$shots/*.png" > /dev/null || { echo "No screenshots to publish"; exit 0; }
          remote="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git init -q branch && cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each publish replaces the branch with one commit holding the newest $KEEP folders, so
          # clones never carry the screenshot history.
          for attempt in 1 2 3; do
            git rm -rqf --ignore-unmatch . && rm -rf -- * && lease=""
            if git fetch -q --depth 1 "$remote" ios-screenshots; then
              # -f: a retry starts from the commit the rejected push made, so local changes are expected.
              git checkout -qf --detach FETCH_HEAD
              lease="$(git rev-parse HEAD)"
            fi
            rm -rf "$SHA" && mkdir "$SHA" && cp "$shots"/*.png "$SHA/"
            grep -vx "$SHA" order.txt 2> /dev/null > order.new || true
            echo "$SHA" >> order.new && tail -n "$KEEP" order.new > order.txt && rm order.new
            for dir in */; do grep -qx "${dir%/}" order.txt || rm -rf "$dir"; done
            git checkout -q --orphan "publish-$attempt"
            git add -A && git commit -qm "iOS simulator screenshots, latest $SHA"
            git push -q --force-with-lease="ios-screenshots:$lease" "$remote" HEAD:refs/heads/ios-screenshots && exit 0
          done
          exit 1
