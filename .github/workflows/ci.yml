name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories that cannot be fixed yet are listed, with reasons, in pnpm-workspace.yaml.
      - name: Dependency audit
        run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The landing, privacy and support pages; deploy-site.yml publishes them after merge.
      - name: Build the site
        run: pnpm --filter @car/site build
      # Catches what typechecking cannot: Metro failing to resolve workspace packages, or
      # dependencies that do not match the Expo SDK.
      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Bundle the app
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --platform web --output-dir ${{ runner.temp }}/expo-export

  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The edge function is a bundle of packages/server. Check it builds, loads in Deno and
      # answers, as it will on Supabase.
      - run: pnpm --filter @car/server build
      - run: scripts/smoke-assistant.sh

  # Builds a release APK and drives it on an Android emulator with Maestro. iOS is the main target,
  # but this keeps the app launching and laying out on Android. Needs no Google Play account: the
  # release build is signed with the debug key that `expo prebuild` generates.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 1
      # Pinned so a Maestro release cannot change or break CI unannounced.
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android
      # Only the emulator's architecture, which roughly quarters the native build.
      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator runner runs each script line on its own, so the steps live in one script.
          script: scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-emulator
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Check scripts and sign-in emails
        run: |
          shellcheck scripts/*.sh
          for f in supabase/templates/magic_link.html supabase/templates/confirmation.html; do
            grep -qF '{{ .Token }}' "$f" || { echo "$f must show the sign-in code"; exit 1; }
          done
      - run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level warning --fail-on warning
      - run: supabase test db
