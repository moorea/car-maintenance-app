name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Runs on main are not cancelled once
# started, so they finish and save the caches pull requests start from; GitHub still keeps only
# the newest waiting run, so a merge that lands while two others run may not get its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the iOS and Android jobs need to run: a pull request that changes nothing the app is
  # built from (only docs, the server, the database, tests) skips them. They are skipped with a job
  # condition rather than a workflow path filter, so their required checks still report.
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: scripts/needs-native.sh >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories that cannot be fixed yet are listed, with reasons, in pnpm-workspace.yaml.
      - name: Dependency audit
        run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The landing, privacy and support pages; deploy-site.yml publishes them after merge.
      - name: Build the site
        run: pnpm --filter @car/site build
      # Catches what typechecking cannot: Metro failing to resolve workspace packages, or
      # dependencies that do not match the Expo SDK.
      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Bundle the app
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --platform web --output-dir "$RUNNER_TEMP/expo-export"

  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # The edge function is a bundle of packages/server. Check it builds, loads in Deno and
      # answers, as it will on Supabase.
      - run: pnpm --filter @car/server build
      - run: scripts/smoke-assistant.sh

  # Builds a release APK and drives it on an Android emulator with Maestro. iOS is the main target,
  # but this keeps the app launching and laying out on Android. Needs no Google Play account: the
  # release build is signed with the debug key that `expo prebuild` generates.
  android:
    needs: changes
    # Runs unless the changes job decided it can skip, so a failure there never skips a build.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 1
      # Pinned so a Maestro release cannot change or break CI unannounced.
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - run: pnpm install --frozen-lockfile
      # A change to JavaScript only reuses a cached native build; see scripts/reuse-native-build.sh.
      # Android bundles first because its image assets are part of the key.
      - name: Bundle the JavaScript
        run: scripts/reuse-native-build.sh bundle android "$RUNNER_TEMP/js"
      - name: Fingerprint the native build
        id: native
        run: |
          key=$(scripts/reuse-native-build.sh key android "$RUNNER_TEMP/js")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore a native build with the same fingerprint
        id: cached
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native
          # Never an exact hit: the newest build saved under this prefix wins.
          key: ${{ steps.native.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.native.outputs.key }}-
      - name: Reuse it with this commit's JavaScript
        id: reuse
        if: steps.cached.outputs.cache-matched-key != ''
        # Anything unexpected falls back to a full build below.
        continue-on-error: true
        run: |
          scripts/reuse-native-build.sh apply android "$RUNNER_TEMP/native" "$RUNNER_TEMP/js"
          echo "APK=$RUNNER_TEMP/native/app.apk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.reuse.outcome != 'success'
      - name: Generate the native project
        if: steps.reuse.outcome != 'success'
        working-directory: apps/mobile
        run: npx expo prebuild --platform android
      # Only the emulator's architecture, which roughly quarters the native build.
      - name: Build the release APK
        if: steps.reuse.outcome != 'success'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Keep the build for reuse
        if: steps.reuse.outcome != 'success'
        run: scripts/reuse-native-build.sh keep android "$RUNNER_TEMP/native"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.reuse.outcome != 'success'
        # A cache outage should not fail the build.
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/native
          key: ${{ steps.native.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore Maestro
        id: maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro.outputs.cache-hit != 'true'
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator runner runs each script line on its own, so the steps live in one script.
          script: scripts/android-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: android-emulator
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro

  # Keeps the latest emulator screenshots on the android-screenshots branch, one folder per commit,
  # so a PR can show them inline and they can be fetched with plain git. A separate job so the
  # write token never shares a runner with install scripts or app code. Skipped for forks.
  android-screenshots:
    needs: android
    # Dependabot's PRs get a read-only token, so they skip publishing too.
    if: ${{ !cancelled() && needs.android.result != 'skipped' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KEEP: 40
    steps:
      # Missing when the build failed before the emulator ran; the step below then finds nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: android-emulator
          path: ${{ runner.temp }}/artifact
      - name: Publish to the android-screenshots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          shots="$RUNNER_TEMP/artifact/screenshots"
          compgen -G "$shots/*.png" > /dev/null || { echo "No screenshots to publish"; exit 0; }
          remote="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git init -q branch && cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each publish replaces the branch with one commit holding the newest $KEEP folders, so
          # clones never carry the screenshot history.
          for attempt in 1 2 3; do
            git rm -rqf --ignore-unmatch . && rm -rf -- * && lease=""
            if git fetch -q --depth 1 "$remote" android-screenshots; then
              # -f: a retry starts from the commit the rejected push made, so local changes are expected.
              git checkout -qf --detach FETCH_HEAD
              lease="$(git rev-parse HEAD)"
            fi
            rm -rf "$SHA" && mkdir "$SHA" && cp "$shots"/*.png "$SHA/"
            grep -vx "$SHA" order.txt 2> /dev/null > order.new || true
            echo "$SHA" >> order.new && tail -n "$KEEP" order.new > order.txt && rm order.new
            for dir in */; do grep -qx "${dir%/}" order.txt || rm -rf "$dir"; done
            git checkout -q --orphan "publish-$attempt"
            git add -A && git commit -qm "Android emulator screenshots, latest $SHA"
            git push -q --force-with-lease="android-screenshots:$lease" "$remote" HEAD:refs/heads/android-screenshots && exit 0
          done
          exit 1

  # The repo is public, so an unsafe workflow or a committed key is open to everyone. zizmor audits
  # the workflows (injection, credentials, unpinned or impostor actions); gitleaks scans every
  # commit for secrets. Both are pinned, and gitleaks is checked against its published checksum.
  security:
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: 1.31.1
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit workflows
        env:
          # Lets zizmor check that each pinned commit really belongs to the action it names.
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==$ZIZMOR_VERSION" --format=github .github
      - name: Scan for secrets
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner .

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Deploys apply migrations in timestamp order and refuse one older than the newest applied.
      - name: Check new migrations sort after main's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-migration-order.sh "origin/$BASE_REF"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Check scripts and sign-in emails
        run: |
          shellcheck scripts/*.sh
          for f in supabase/templates/magic_link.html supabase/templates/confirmation.html; do
            grep -qF '{{ .Token }}' "$f" || { echo "$f must show the sign-in code"; exit 1; }
          done
      - run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level warning --fail-on warning
      - run: supabase test db

  # Real sync, end to end: the app's data layer on Node, as two or more phones, against a local
  # Supabase (this repo's migrations, RLS, Storage) and a self-hosted PowerSync serving this repo's
  # sync rules. Covers what mocks cannot: offline queues, other owners, and deletes propagating.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      # Only what the data layer talks to: Postgres, Auth, PostgREST, Storage and the gateway.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
      - run: scripts/start-local-sync.sh
      - run: pnpm --filter @car/data test:e2e
      - name: PowerSync logs
        if: ${{ failure() }}
        run: docker logs powersync_car-maintenance-app 2>&1 | tail -n 300

  # Builds the app for the iOS simulator and launches it, since screens are otherwise only run on
  # the web build. Needs no Apple account: simulator builds are not code signed.
  ios:
    needs: changes
    # Runs unless the changes job decided it can skip, so a failure there never skips a build.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 1
      # Pinned so a Maestro release cannot change or break CI unannounced.
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: 1
      # Starting the XCTest driver on a cold simulator can take over the 2 minute default.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Boots while the app builds; the install step waits for it.
      - name: Boot a simulator
        run: |
          # The UI flows tap round buttons by screen position, so prefer one standard size and
          # only fall back to whichever iPhone the runner image has.
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))]
                | ([.[] | select(.name == "iPhone 17 Pro")] + .)[0].udid')
          [ "$udid" != null ] || { echo "No iPhone simulator available"; xcrun simctl list; exit 1; }
          echo "Booting $udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xcodebuild -version
      # A change to JavaScript only reuses a cached native build; see scripts/reuse-native-build.sh.
      - name: Fingerprint the native build
        id: native
        run: |
          key=$(scripts/reuse-native-build.sh key ios)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore a native build with the same fingerprint
        id: cached
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native
          # Never an exact hit: the newest build saved under this prefix wins.
          key: ${{ steps.native.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.native.outputs.key }}-
      - name: Reuse it with this commit's JavaScript
        id: reuse
        if: steps.cached.outputs.cache-matched-key != ''
        # Anything unexpected falls back to a full build below.
        continue-on-error: true
        run: |
          scripts/reuse-native-build.sh bundle ios "$RUNNER_TEMP/js"
          scripts/reuse-native-build.sh apply ios "$RUNNER_TEMP/native" "$RUNNER_TEMP/js"
      - name: Generate the native project
        if: steps.reuse.outcome != 'success'
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        if: steps.reuse.outcome != 'success'
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace PocketPitCrew.xcworkspace \
            -scheme PocketPitCrew \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
      - name: Keep the build for reuse
        if: steps.reuse.outcome != 'success'
        run: scripts/reuse-native-build.sh keep ios "$RUNNER_TEMP/native"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.reuse.outcome != 'success'
        # A cache outage should not fail the build.
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/native
          key: ${{ steps.native.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install the app on the simulator
        run: |
          xcrun simctl bootstatus "$SIMULATOR"
          xcrun simctl install "$SIMULATOR" "$RUNNER_TEMP/native/PocketPitCrew.app"
      - name: Restore Maestro
        id: maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro.outputs.cache-hit != 'true'
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: UI flows (smoke test and screen sweep)
        run: |
          maestro test --test-output-dir "$RUNNER_TEMP/maestro" --debug-output "$RUNNER_TEMP/maestro/debug" --flatten-debug-output \
            apps/mobile/e2e
      # Screens again at the largest accessibility text size, to see Dynamic Type at its limit.
      - name: Largest text size
        run: |
          xcrun simctl ui booted content_size accessibility-extra-extra-extra-large
          maestro test --test-output-dir "$RUNNER_TEMP/maestro/large-text" \
            --debug-output "$RUNNER_TEMP/maestro/large-text/debug" --flatten-debug-output apps/mobile/e2e-large-text
      - name: Explain failed flows
        if: failure()
        run: scripts/maestro-report.sh "$RUNNER_TEMP/maestro"
      - name: Collect screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          # takeScreenshot writes to the working directory; failure screenshots go to the output dir.
          find . "$RUNNER_TEMP/maestro" -name '*.png' -newer package.json \
            -not -path '*/node_modules/*' -not -path '*/ios/*' -not -name 'App-Icon*' \
            -exec cp {} "$RUNNER_TEMP/screenshots/" \; || true
          xcrun simctl io booted screenshot "$RUNNER_TEMP/screenshots/last.png" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro

  # Keeps the latest screenshots on the ios-screenshots branch, one folder per commit, so a PR can
  # show them inline and they can be fetched with plain git. A separate job so the write token
  # never shares a runner with install scripts or app code. Skipped for forks (no write token).
  ios-screenshots:
    needs: ios
    if: ${{ !cancelled() && needs.ios.result != 'skipped' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KEEP: 40
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/artifact
      - name: Publish to the ios-screenshots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          shots="$RUNNER_TEMP/artifact/screenshots"
          compgen -G "$shots/*.png" > /dev/null || { echo "No screenshots to publish"; exit 0; }
          remote="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git init -q branch && cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each publish replaces the branch with one commit holding the newest $KEEP folders, so
          # clones never carry the screenshot history.
          for attempt in 1 2 3; do
            git rm -rqf --ignore-unmatch . && rm -rf -- * && lease=""
            if git fetch -q --depth 1 "$remote" ios-screenshots; then
              # -f: a retry starts from the commit the rejected push made, so local changes are expected.
              git checkout -qf --detach FETCH_HEAD
              lease="$(git rev-parse HEAD)"
            fi
            rm -rf "$SHA" && mkdir "$SHA" && cp "$shots"/*.png "$SHA/"
            grep -vx "$SHA" order.txt 2> /dev/null > order.new || true
            echo "$SHA" >> order.new && tail -n "$KEEP" order.new > order.txt && rm order.new
            for dir in */; do grep -qx "${dir%/}" order.txt || rm -rf "$dir"; done
            git checkout -q --orphan "publish-$attempt"
            git add -A && git commit -qm "iOS simulator screenshots, latest $SHA"
            git push -q --force-with-lease="ios-screenshots:$lease" "$remote" HEAD:refs/heads/ios-screenshots && exit 0
          done
          exit 1
