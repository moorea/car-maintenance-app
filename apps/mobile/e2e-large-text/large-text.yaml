# Run by the CI jobs `ios` and `android` after the other flows, with the largest text size set, so
# the screenshots show Dynamic Type (or Android's font scale) at its limit.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Tappable cards are one accessibility element, so the car card reads "Demo car, …".
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 60000
- takeScreenshot: 7-large-text-garage
- tapOn: 'Log'
- waitForAnimationToEnd
- takeScreenshot: 8-large-text-service-log
- tapOn: 'Car'
# At this size the tab can take a moment to switch; scrolling the log by mistake loses the way.
- extendedWaitUntil:
    visible: 'ODOMETER'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 9-large-text-car
# The demo car's recall card, whose "Risk and fix" toggle label scales too. The Car tab opens on
# the schedule, so switch to recalls first. At this size the cards above the tabs fill several
# screens and each swipe on iOS takes about 5 seconds, so 30 seconds ran out after 6 swipes, short
# of the tabs.
- scrollUntilVisible:
    element: 'Recalls.*'
    direction: DOWN
    timeout: 90000
# The scroll stops as soon as the tabs show, which can be under the floating tab bar, where a tap
# lands on the Log tab instead. A short, slow drag lifts them a fifth of the screen, clear of it
# (centring them fails at this size, and a whole scroll can carry them off the top).
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 1500
- waitForAnimationToEnd
- tapOn: 'Recalls.*'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 'Risk and fix'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 10-large-text-recall
