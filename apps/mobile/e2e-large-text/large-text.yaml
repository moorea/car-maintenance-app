# Run by the CI jobs `ios` and `android` after the other flows, with the largest text size set, so
# the screenshots show Dynamic Type (or Android's font scale) at its limit.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Tappable cards are one accessibility element, so the car card reads "Demo car, …".
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 60000
- takeScreenshot: 7-large-text-garage
- tapOn: 'Log'
- waitForAnimationToEnd
- takeScreenshot: 8-large-text-service-log
- tapOn: 'Car'
- waitForAnimationToEnd
- takeScreenshot: 9-large-text-car
# The demo car's recall card, whose "Risk and fix" toggle label scales too. The Car tab opens on
# the schedule, so switch to recalls first.
- scrollUntilVisible:
    element: 'Recalls.*'
    direction: DOWN
    timeout: 30000
# The scroll stops as soon as the tabs show, which can be under the floating tab bar, where a tap
# lands on the Log tab instead. One more scroll lifts them clear (centring them fails at this size).
- scroll
- waitForAnimationToEnd
- tapOn: 'Recalls.*'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 'Risk and fix'
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 10-large-text-recall
