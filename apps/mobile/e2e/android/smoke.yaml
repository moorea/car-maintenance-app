# Smoke test for the Android emulator build (CI job `android`). The build has no backend settings,
# so the app opens on demo data, already signed in. Run locally with
# `maestro test apps/mobile/e2e/android` against an emulator with the release build installed.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 1-garage
- tapOn: 'Log'
- assertVisible: 'Service log'
- waitForAnimationToEnd
- takeScreenshot: 2-service-log
- tapOn: 'Car'
- extendedWaitUntil:
    visible: 'Recalls · 2'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 3-car
# The fuel economy chart and cost bars are drawn from Compose views on Android.
- scrollUntilVisible:
    element: 'Fuel & costs'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: 'Fuel & costs'
# The page, not the car page the tap left: the screenshot used to catch the car page mid-push.
- extendedWaitUntil:
    visible: 'Fuel economy'
    timeout: 5000
- takeScreenshot: 4-fuel
- back
- tapOn: 'Garage'
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 10000
- tapOn: 'Account'
- scrollUntilVisible:
    element: 'Sign out'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 5-account
# Deleting asks first, saying everything it removes; cancel leaves the account as it was.
- scrollUntilVisible:
    element: 'Delete account'
    centerElement: true
    timeout: 30000
- tapOn: 'Delete account'
- extendedWaitUntil:
    visible: 'Delete your account?'
    timeout: 5000
- takeScreenshot: 5-account-delete-confirm
# The confirmation's buttons can sit below the fold, under the tab bar.
- scrollUntilVisible:
    element: 'Cancel'
    centerElement: true
    timeout: 30000
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Sign out'
    centerElement: true
    timeout: 30000
# Signing out takes a second tap, so a stray one cannot.
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Tap again to sign out'
    timeout: 5000
- takeScreenshot: 5-account-sign-out-confirm
- tapOn: 'Tap again to sign out'
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 10000
- takeScreenshot: 6-sign-in
- tapOn: 'you@example.com'
- inputText: 'demo@example.com'
- hideKeyboard
- tapOn: 'Email me a code'
- extendedWaitUntil:
    visible: 'Enter the code we sent to demo@example.com.'
    timeout: 10000
- takeScreenshot: 7-sign-in-code
- tapOn: 'Code from the email'
# A whole code signs in by itself.
- inputText: '123456'
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 10000
