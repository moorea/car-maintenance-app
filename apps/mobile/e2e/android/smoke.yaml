# Smoke test for the Android emulator build (CI job `android`). The build has no backend settings,
# so the app opens on demo data, already signed in. Run locally with
# `maestro test apps/mobile/e2e/android` against an emulator with the release build installed.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 1-garage
- tapOn: 'Log'
- assertVisible: 'Service log'
- waitForAnimationToEnd
- takeScreenshot: 2-service-log
- tapOn: 'Car'
- extendedWaitUntil:
    visible: 'Recalls · 2'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 3-car
# The fuel economy chart and cost bars are drawn from Compose views on Android.
- scrollUntilVisible:
    element: 'Fuel & costs'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: 'Fuel & costs'
- waitForAnimationToEnd
- takeScreenshot: 4-fuel
- back
- tapOn: 'Garage'
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 10000
- tapOn: 'Account'
- scrollUntilVisible:
    element: 'Sign out'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 5-account
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 10000
- takeScreenshot: 6-sign-in
- tapOn: 'you@example.com'
- inputText: 'demo@example.com'
- hideKeyboard
- tapOn: 'Email me a code'
- extendedWaitUntil:
    visible: 'Enter the code we sent to demo@example.com.'
    timeout: 10000
- takeScreenshot: 7-sign-in-code
- tapOn: 'Code'
- inputText: '123456'
- hideKeyboard
# The page title also reads "Sign in"; the button is the second match.
- tapOn:
    text: 'Sign in'
    index: 1
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 10000
