# An electric car on Android, as apps/mobile/e2e/electric.yaml does on iOS.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      '-demoElectric': true
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 90000
- tapOn: 'Car'
- scrollUntilVisible:
    element: 'Charging & costs'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 80-car-electric
# The charging page's own chart, not the car page the tap left. Tried twice, as a tap during the
# scroll's settle can be dropped; a second tap on the page itself lands on its title, harmlessly.
- retry:
    maxRetries: 1
    commands:
      - tapOn: 'Charging & costs'
      - extendedWaitUntil:
          visible: 'Charging efficiency'
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 80-charging
- tapOn: 'Log a charge'
- waitForAnimationToEnd
- takeScreenshot: 80-charging-form
