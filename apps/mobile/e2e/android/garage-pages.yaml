# The pages that open from the Garage and Log buttons, as apps/mobile/e2e/garage-pages.yaml does on
# iOS. Android reads the round buttons' labels, so they are tapped by name.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 90000
- tapOn: 'Account'
- scrollUntilVisible:
    element: 'Export or import data'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: 'Export or import data'
- extendedWaitUntil:
    visible: 'Your data'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 40-your-data
# System back steps from your data to the account, then to the garage.
- back
- assertVisible: 'Export or import data'
- back
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 5000

- tapOn: 'Reminders'
# The garage's button reads "Reminders" too, so wait for the page's own switch.
- extendedWaitUntil:
    visible: 'Service reminders'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 41-reminders
- back

- tapOn: 'Add car'
- extendedWaitUntil:
    visible: 'Add your car'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 42-add-car
- back
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 5000

- tapOn: 'Log'
- assertVisible: 'Service log'
- tapOn: 'Log service'
- waitForAnimationToEnd
- takeScreenshot: 43-log-form
- back
- waitForAnimationToEnd

# A logged service opens in a sheet, to correct or delete it.
- tapOn: 'Engine air filter.*'
- extendedWaitUntil:
    visible: 'Done'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 44-log-entry
# The sheet opens half height, so the delete button may sit below its fold.
- scrollUntilVisible:
    element: 'Delete service'
    timeout: 10000
- tapOn: 'Delete service'
- assertVisible: 'Tap again to delete'
- takeScreenshot: 44-log-entry-delete
- tapOn: 'Edit'
- extendedWaitUntil:
    visible: 'Edit service'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 44-log-edit
