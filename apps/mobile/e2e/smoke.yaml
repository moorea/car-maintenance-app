# Smoke test for the iOS simulator build (CI job `ios`). The build has no backend settings, so the
# app opens on demo data, already signed in. Run locally with `maestro test apps/mobile/e2e`.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Tappable cards are one accessibility element, so the car card reads "Demo car, …".
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 60000
- takeScreenshot: 1-garage
- tapOn: 'Log'
- assertVisible: 'Service log'
- waitForAnimationToEnd
- takeScreenshot: 2-service-log
- tapOn: 'Car'
- extendedWaitUntil:
    visible: 'Registration & insurance.*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 3-car
# Centred, so the tap can't land on the tab bar floating over the bottom of the page.
- scrollUntilVisible:
    element: 'Registration & insurance.*'
    centerElement: true
- tapOn: 'Registration & insurance.*'
- assertVisible: 'Renewals'
- waitForAnimationToEnd
- takeScreenshot: 3-renewals
- tapOn: 'Back'
- scrollUntilVisible:
    element: 'Recalls · 2'
- tapOn: 'Garage'
- extendedWaitUntil:
    visible: 'Demo car.*'
    timeout: 10000
- tapOn: 'Account'
- scrollUntilVisible:
    element: 'Sign out'
- takeScreenshot: 4-account
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 10000
- takeScreenshot: 5-sign-in
- tapOn: 'you@example.com'
- inputText: 'demo@example.com'
- tapOn: 'Email me a code'
- extendedWaitUntil:
    visible: 'Enter the code we sent to demo@example.com.'
    timeout: 10000
- takeScreenshot: 6-sign-in-code
# The code field has no placeholder to match, so tap it where it sits below its label.
- tapOn:
    point: '50%,23%'
- inputText: '123456'
# The page title also reads "Sign in"; the button is the second match.
- tapOn:
    text: 'Sign in'
    index: 1
- extendedWaitUntil:
    visible: 'Demo car'
    timeout: 10000
