# Renaming a car from its page and choosing how it is drawn, then removing it. Removing the demo's only car leaves the first
# screen asking for a car; the demo data comes back on the next launch.
appId: com.moorea.carmaintenance
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: 'Demo car'
    timeout: 60000
- tapOn: 'Car'
# The car's drawing loads as the page opens; tap once it has settled.
- extendedWaitUntil:
    visible: 'ODOMETER'
    timeout: 10000
- waitForAnimationToEnd
- tapOn: 'Edit car'
- extendedWaitUntil:
    visible: 'Remove car'
    timeout: 5000
- takeScreenshot: 50-edit-car
- tapOn: 'Demo car'
- eraseText: 20
- inputText: 'Daily'
- tapOn: 'Pickup'
- tapOn: 'Red'
- takeScreenshot: 50-edit-car-look
- tapOn: 'Save'
- extendedWaitUntil:
    notVisible: 'Remove car'
    timeout: 5000
- tapOn: 'Garage'
- extendedWaitUntil:
    visible: 'Daily'
    timeout: 5000
- takeScreenshot: 50-garage-renamed
- tapOn: 'Daily'
- tapOn: 'Edit car'
- tapOn: 'Remove car'
- extendedWaitUntil:
    visible: 'Tap again to remove'
    timeout: 5000
- takeScreenshot: 50-remove-confirm
- tapOn: 'Tap again to remove'
- extendedWaitUntil:
    visible: 'Add your first car'
    timeout: 10000
- takeScreenshot: 50-after-remove
