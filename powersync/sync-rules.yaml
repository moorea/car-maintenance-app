# PowerSync Sync Streams: which Postgres rows each signed-in user gets on their phone.
# Deploys to the hosted instance after it merges (.github/workflows/deploy-db.yml); never
# edit it in the PowerSync dashboard, since the next deploy replaces what is there.
# Row-level security does not apply to sync, so these queries are the read boundary for the
# device: every stream must be scoped by auth.user_id(). Writes go through PostgREST, where
# RLS does apply.
config:
  edition: 3

streams:
  # Everything about the user's own vehicles.
  owned_vehicles:
    auto_subscribe: true
    queries:
      - SELECT * FROM vehicles WHERE owner_id = auth.user_id()
      - SELECT * FROM odometer_readings WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM service_records WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM reminders WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM warranties WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM fill_ups WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM tire_sets WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM renewals WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM attachments WHERE vehicle_id IN (SELECT id FROM vehicles WHERE owner_id = auth.user_id())

  # Shared reference data for the configurations the user's vehicles use: schedules, recalls,
  # complaint summaries and manufacturer bulletins.
  vehicle_configs:
    auto_subscribe: true
    queries:
      - SELECT * FROM vehicle_configs WHERE id IN (SELECT config_id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM maintenance_items WHERE config_id IN (SELECT config_id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM recalls WHERE config_id IN (SELECT config_id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM complaint_summaries WHERE config_id IN (SELECT config_id FROM vehicles WHERE owner_id = auth.user_id())
      - SELECT * FROM bulletins WHERE config_id IN (SELECT config_id FROM vehicles WHERE owner_id = auth.user_id())
